# ============================================================
# DB Backup to GitHub Release — PN-041 · فاز ۴ (شورا-ن۰۶۷)
# ------------------------------------------------------------
# لایهٔ ۴ قلعهٔ داده: پشتیبان روزانهٔ خارجی — فقط برای فاجعهٔ کامل
# (اگر سرور و upload/ هر دو پاک شوند).
#
# منبع: روت زندهٔ /api/admin/db-export (VACUUM اتمی) با Bearer مالک.
# قانون دادهٔ مقدس (شورا-ن۰۶۳): صفر پوش اگر دیتابیس زنده کوچک‌تر از
# آخرین نسخهٔ پشتیبان باشد (داور: شمارش رکورد در نوت Release قبلی).
#
# Secretهای لازم (GitHub → Settings → Secrets → Actions):
#   MELKA_LIVE_URL    — نشانی عمومی سرور (پیش‌فرض: preview فعلی)
#   MELKA_OWNER_TOKEN — Bearer مالک (= MASTER_ACCESS_CODE)
#   MIN_RECORDS       — کف انتظار آگهی‌ها (پیش‌فرض: ۲۷۰۰۰)
# هرس: نگه‌داری ۳ Release اخیر (db-*).
# ============================================================
name: DB Backup to GitHub Release

on:
  schedule:
    - cron: '0 3 * * *' # روزانه ۰۳:۰۰ UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Check secrets (fail-closed with clear message)
        run: |
          if [ -z "${{ secrets.MELKA_OWNER_TOKEN }}" ]; then
            echo "::warning::MELKA_OWNER_TOKEN secret is MISSING — set it in Settings → Secrets → Actions (Bearer = MASTER_ACCESS_CODE). Skipping backup run."
            exit 0
          fi

      - name: Download latest DB from live server
        env:
          LIVE_URL: ${{ secrets.MELKA_LIVE_URL }}
          OWNER_TOKEN: ${{ secrets.MELKA_OWNER_TOKEN }}
          DEFAULT_URL: https://preview-chat-35e0018b-b9e9-411f-88d7-f1f774acfff0.space-z.ai
        run: |
          URL="${LIVE_URL:-$DEFAULT_URL}"
          echo "Downloading from $URL/api/admin/db-export ..."
          curl -fsSL --max-time 600 "$URL/api/admin/db-export" \
            -H "Authorization: Bearer $OWNER_TOKEN" \
            -D /tmp/headers.txt -o latest.db
          cat /tmp/headers.txt | grep -i "^x-db-" || true
          RECORDS="$(grep -i '^x-db-record-count:' /tmp/headers.txt | tr -d '\r' | awk '{print $2}')"
          INTEGRITY="$(grep -i '^x-db-integrity:' /tmp/headers.txt | tr -d '\r' | awk '{print $2}')"
          echo "RECORDS=$RECORDS" >> "$GITHUB_ENV"
          echo "INTEGRITY=$INTEGRITY" >> "$GITHUB_ENV"

      - name: Verify integrity + sacred minimum
        env:
          MIN_RECORDS: ${{ secrets.MIN_RECORDS }}
        run: |
          MIN="${MIN_RECORDS:-27000}"
          sqlite3 latest.db "PRAGMA integrity_check" | grep -q ok || { echo "::error::integrity_check failed"; exit 1; }
          COUNT=$(sqlite3 latest.db "SELECT COUNT(*) FROM PropertyRecord")
          echo "Records: $COUNT (min expected: $MIN)"
          if [ "$COUNT" -lt "$MIN" ]; then
            echo "::error::DB smaller than expected ($COUNT < $MIN) — sacred data guard: skip push"
            exit 1
          fi
          echo "COUNT=$COUNT" >> "$GITHUB_ENV"

      - name: Sacred law — never push a smaller DB than the last backup
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          LAST_NOTES=$(gh release list --limit 30 2>/dev/null | grep -o 'db-[0-9-]*' | head -1)
          if [ -n "$LAST_NOTES" ]; then
            LAST_COUNT=$(gh release view "$LAST_NOTES" --json body -q .body 2>/dev/null | grep -o 'Records: [0-9]*' | awk '{print $2}')
            if [ -n "$LAST_COUNT" ] && [ "$COUNT" -lt "$LAST_COUNT" ]; then
              echo "::error::Live DB ($COUNT records) is SMALLER than last backup ($LAST_COUNT) — zero-push sacred law (PN-038)"
              exit 1
            fi
          fi

      - name: Compress & Upload
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gzip -9 -c latest.db > "latest.db.gz"
          TAG="db-$(date -u +%Y%m%d-%H%M)"
          gh release create "$TAG" "latest.db.gz" \
            --title "DB Snapshot $(date -u +%Y-%m-%dT%H:%MZ)" \
            --notes "Automated backup (PN-041 · شورا-ن۰۶۷). Records: $COUNT · Integrity: $INTEGRITY · Source: /api/admin/db-export (VACUUM atomic)"

      - name: Prune old releases (keep 3)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release list --limit 100 2>/dev/null | grep -o 'db-[0-9-]*' | tail -n +4 | while read -r TAG; do
            echo "Deleting old release: $TAG"
            gh release delete "$TAG" --yes || true
            git push --delete origin "refs/tags/$TAG" 2>/dev/null || true
          done
